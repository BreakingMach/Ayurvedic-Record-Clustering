# Central configuration for ayur_bench (R2/R3: hyperparameters set a priori, never tuned on labels)

dataset:
  zip_path: "Dataset/tridosha.zip"
  csv_name: "Updated_Prakriti_With_Features.csv"
  label_column: "Dosha"
  keep_duplicates: true
  class_order:
    - "Vata+Pitta"
    - "Vata"
    - "Pitta"
    - "Kapha"
    - "Pitta+Kapha"
    - "Vata+Kapha"

distances:
  missing_numeric_imputation: "median"
  missing_categorical_imputation: "mode"
  gower_all_missing_pair_distance: 1.0

evaluation:
  knn:
    n_neighbors: 5
    n_splits: 5
    n_repeats: 3
    random_state: 42
  retrieval:
    ks: [1, 5, 10]
    tie_breaking: "mergesort"
    smallest_n_classes: 3
  clustering:
    linkages:
      - "average"
      - "complete"

stats:
  alpha: 0.05
  correction: "holm"

experiment_real:
  metrics:
    - "gower"
    - "euclidean"
    - "cosine"
  equivalence_metrics:
    - "gower"
    - "euclidean"
    - "cosine"
    - "hamming"
  subset_sizes: [3, 5, 8, 12, 20, 29]
  n_subsets_per_m: 20
  subset_seed_base: 1000
  shuffled_control_seed: 2026
  shuffled_control_checks:
    chance_macro_p5: 0.1666666667
    macro_p5_tolerance: 0.04
    knn_macro_f1_max: 0.22
  output_dir: "results"
  findings_doc: "docs/REAL_DATA_FINDINGS.md"

# FROZEN PARAMETER GRID: grid fixed before any results were seen (Rule R3)
synthetic:
  label: "SYNTHETIC/SIMULATED"
  default_output_csv: "Dataset/synthetic/synthetic_cases_default.csv"
  default:
    n_samples: 1200
    seed: 42
    categorical_eps: 0.2
    numeric_cohens_d: 0.5
    bmi_sbp_copula_rho: 0.4
    outlier_fraction: 0.0
    missing_fraction: 0.0
    label_noise_rate: 0.0
  vitals_spec:
    age:
      mean: 42.0
      std: 12.0
      min_clip: 18.0
      max_clip: 80.0
      cohens_d_override: 0.0
    bmi:
      log_mean: 3.12
      log_std: 0.13
      min_clip: 14.0
      max_clip: 55.0
      distribution: "lognormal"
    systolic_bp:
      mean: 120.0
      std: 11.0
      min_clip: 80.0
      max_clip: 220.0
      distribution: "gaussian"
    pulse:
      mean: 74.0
      std: 7.5
      min_clip: 45.0
      max_clip: 130.0
      distribution: "gaussian"
    outlier_sigma_multiplier: 6.0
  grid:
    categorical_eps: [0.0, 0.1, 0.2, 0.3, 0.4]
    numeric_cohens_d: [0.0, 0.25, 0.5, 1.0, 2.0]
    outlier_fraction: [0.0, 0.05]
    missing_fraction: [0.0, 0.05, 0.10]
    label_noise_rate: [0.0, 0.1, 0.2]
    n_seeds: 5
    seed_base: 5000

experiment_synthetic:
  label: "SYNTHETIC/SIMULATED"
  metrics:
    - "gower"
    - "euclidean"
    - "cosine"
  baseline:
    categorical_eps: 0.2
    numeric_cohens_d: 1.0
    outlier_fraction: 0.0
    missing_fraction: 0.0
    label_noise_rate: 0.0
    m_traits: 29
  sweeps:
    categorical_eps: [0.0, 0.1, 0.2, 0.3, 0.4]
    numeric_cohens_d: [0.0, 0.25, 0.5, 1.0, 2.0]
    outlier_fraction: [0.0, 0.05]
    missing_fraction: [0.0, 0.05, 0.10]
    label_noise_rate: [0.0, 0.1, 0.2]
    m_traits: [5, 10, 20, 29]
  n_seeds: 20
  fallback_n_seeds: 10
  max_estimated_minutes: 60.0
  seed_base: 5000
  shuffled_control_seed: 6026
  shuffled_control_checks:
    chance_macro_p5: 0.1666666667
    macro_p5_tolerance: 0.045
    knn_macro_f1_max: 0.22
  n_jobs: -1
  cache_dir: "results/.cache_synthetic"
  output_dir: "results"
  findings_doc: "docs/SYNTHETIC_FINDINGS.md"

expert_review:
  n_queries: 40
  top_k: 5
  seed: 2026
  rating_sheet: "expert_review/rating_sheet.xlsx"
  answer_key: "expert_review/private/answer_key.csv"
  output_json: "results/expert_review.json"
